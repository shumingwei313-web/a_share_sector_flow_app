<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>霓虹贪吃蛇 · NEO SERPENT</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a2e;font-family:'Orbitron',sans-serif;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas#game{display:block;width:100%;height:100%;position:fixed;top:0;left:0;z-index:1;touch-action:none}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.overlay.active{pointer-events:all}
#startScreen{background:radial-gradient(ellipse at center,rgba(10,10,46,0.95) 0%,rgba(5,5,20,0.98) 100%);overflow:hidden;position:relative}
#startScreen canvas.beat-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
#startScreen>*{position:relative;z-index:1}
#startScreen h1{font-size:clamp(2rem,6vw,4rem);font-weight:900;color:#00ffff;text-shadow:0 0 10px #00ffff,0 0 30px #00ffff,0 0 60px #0088ff,0 0 100px #0044ff;margin-bottom:0.2em;letter-spacing:0.05em}
#startScreen h1 span{opacity:0;animation:letterGlow 0.5s forwards}
@keyframes letterGlow{to{opacity:1;text-shadow:0 0 10px #00ffff,0 0 30px #00ffff,0 0 60px #0088ff}}
#startScreen h2{font-size:clamp(0.8rem,2.5vw,1.4rem);color:#ff00ff;text-shadow:0 0 8px #ff00ff,0 0 20px #ff00ff;margin-bottom:1.5em;font-weight:400;letter-spacing:0.2em}
.btn-start{font-family:'Orbitron',sans-serif;font-size:clamp(0.9rem,2vw,1.2rem);padding:16px 48px;background:transparent;border:2px solid #00ffff;color:#00ffff;border-radius:50px;cursor:pointer;text-shadow:0 0 8px #00ffff;box-shadow:0 0 15px rgba(0,255,255,0.3),inset 0 0 15px rgba(0,255,255,0.1);animation:pulse 2s infinite;transition:all 0.3s;min-height:48px}
.btn-start:hover{background:rgba(0,255,255,0.15);box-shadow:0 0 30px rgba(0,255,255,0.5),inset 0 0 20px rgba(0,255,255,0.2);transform:scale(1.05)}
@keyframes pulse{0%,100%{box-shadow:0 0 15px rgba(0,255,255,0.3),inset 0 0 15px rgba(0,255,255,0.1)}50%{box-shadow:0 0 25px rgba(0,255,255,0.5),inset 0 0 25px rgba(0,255,255,0.2)}}
.start-record{color:rgba(200,220,255,0.6);font-size:0.75rem;margin-top:1.5em;font-family:'Noto Sans SC',sans-serif;text-align:center;line-height:1.8}
.start-record span{color:#00ffff;font-family:'Orbitron',sans-serif}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;display:none}
.hud-tl{position:absolute;top:calc(20px + env(safe-area-inset-top));left:20px}
.hud-tl div{color:#00ffff;font-size:0.8rem;text-shadow:0 0 6px #00ffff;margin-bottom:6px;backdrop-filter:blur(4px);background:rgba(0,255,255,0.05);padding:4px 12px;border-radius:4px;border:1px solid rgba(0,255,255,0.15);display:flex;align-items:center;gap:6px}
.hud-tr{position:absolute;top:calc(20px + env(safe-area-inset-top));right:20px;display:flex;gap:10px}
.hud-btn{pointer-events:all;width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,255,255,0.4);background:rgba(0,255,255,0.08);color:#00ffff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.hud-btn:hover{background:rgba(0,255,255,0.2)}
.hud-bl{position:absolute;bottom:20px;left:20px}
.hud-bl div{color:#00ffff;font-size:0.75rem;text-shadow:0 0 4px #00ffff;margin-bottom:5px}
.boost-bar{width:120px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;border:1px solid rgba(0,255,255,0.3);overflow:hidden}
.boost-bar-inner{height:100%;background:linear-gradient(90deg,#00ffff,#ff00ff);border-radius:4px;transition:width 0.2s}
#leaderboard{position:absolute;top:60px;right:20px;width:180px;max-height:300px;overflow:hidden;backdrop-filter:blur(6px);background:rgba(10,10,46,0.7);border:1px solid rgba(0,255,255,0.2);border-radius:8px;padding:10px}
#leaderboard h4{color:#00ffff;font-size:0.6rem;text-transform:uppercase;margin-bottom:8px;letter-spacing:0.1em;text-shadow:0 0 4px #00ffff}
.lb-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:0.6rem;color:#aaeeff;transition:all 0.3s;font-family:'Noto Sans SC',sans-serif}
.lb-item.player{color:#00ffff;font-weight:700;text-shadow:0 0 4px #00ffff}
.lb-rank{width:16px;text-align:center;font-family:'Orbitron',sans-serif;font-size:0.55rem}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-len{font-family:'Orbitron',sans-serif;font-size:0.55rem;color:#00ffff}
#minimap{position:fixed;bottom:20px;right:20px;z-index:5;width:140px;height:140px;border:1px solid rgba(0,255,255,0.4);border-radius:8px;background:rgba(10,10,46,0.7);backdrop-filter:blur(4px);box-shadow:0 0 10px rgba(0,255,255,0.2)}
#pauseMenu{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(5,5,20,0.7);backdrop-filter:blur(8px)}
.pause-card{background:rgba(15,15,50,0.95);border:2px solid rgba(0,255,255,0.4);border-radius:16px;padding:40px;text-align:center;box-shadow:0 0 40px rgba(0,255,255,0.15),inset 0 0 30px rgba(0,255,255,0.05);min-width:280px}
.pause-card h2{color:#00ffff;font-size:1.8rem;text-shadow:0 0 10px #00ffff,0 0 30px #00ffff;margin-bottom:30px}
.pause-btn{display:block;width:100%;font-family:'Orbitron',sans-serif;font-size:0.85rem;padding:14px 24px;margin-bottom:12px;border-radius:8px;cursor:pointer;transition:all 0.3s;border:none;min-height:48px}
.pause-btn.primary{background:rgba(0,255,255,0.15);border:2px solid #00ffff;color:#00ffff;text-shadow:0 0 6px #00ffff;box-shadow:0 0 10px rgba(0,255,255,0.3)}
.pause-btn.primary:hover{background:rgba(0,255,255,0.25);box-shadow:0 0 20px rgba(0,255,255,0.5)}
.pause-btn.secondary{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);color:#aaeeff}
.pause-btn.secondary:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.4)}
#killFeed{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;text-align:center}
.kill-msg{font-size:2rem;font-weight:900;color:#ff0066;text-shadow:0 0 10px #ff0066,0 0 30px #ff0066,0 0 60px #ff0066;opacity:0;animation:killPop 1.5s forwards}
@keyframes killPop{0%{opacity:0;transform:scale(0.5)}10%{opacity:1;transform:scale(1.2)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.combo-msg{font-size:1.2rem;color:#ffaa00;text-shadow:0 0 8px #ffaa00;margin-top:5px}
#zoneWarning{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:8;pointer-events:none;font-size:1.4rem;color:#ff3333;text-shadow:0 0 10px #ff0000,0 0 30px #ff0000;opacity:0;font-family:'Noto Sans SC',sans-serif;transition:opacity 0.5s}
#rankUp{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column}
.rank-anim{font-size:2.5rem;font-weight:900;animation:rankCelebrate 2.5s forwards}
@keyframes rankCelebrate{0%{opacity:0;transform:scale(0.3)}15%{opacity:1;transform:scale(1.3)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#gameOver{background:rgba(5,5,20,0.95);backdrop-filter:blur(10px)}
#gameOver h2{font-size:clamp(1.5rem,4vw,2.5rem);color:#ff0055;text-shadow:0 0 10px #ff0055,0 0 30px #ff0055;margin-bottom:0.8em}
#gameOver .stats{color:#aaeeff;font-family:'Noto Sans SC',sans-serif;font-size:0.9rem;margin-bottom:1.5em;line-height:2.2}
#gameOver .stats span{color:#00ffff;font-family:'Orbitron',sans-serif;text-shadow:0 0 5px #00ffff}
.new-record{color:#ffaa00!important;text-shadow:0 0 8px #ffaa00!important;animation:pulse 1s infinite}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(0,255,255,0.5);font-size:0.7rem;z-index:5;pointer-events:none;font-family:'Noto Sans SC',sans-serif}
#joystick{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom));left:80px;width:150px;height:150px;z-index:20;display:none;border-radius:50%;background:rgba(0,255,255,0.08);border:2px solid rgba(0,255,255,0.3)}
#joystickKnob{position:absolute;width:60px;height:60px;border-radius:50%;background:rgba(0,255,255,0.3);border:2px solid rgba(0,255,255,0.6);top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(0,255,255,0.4)}
#boostBtn{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom));right:60px;width:80px;height:80px;z-index:20;display:none;border-radius:50%;background:rgba(255,0,100,0.15);border:2px solid rgba(255,0,100,0.5);color:#ff0064;font-family:'Orbitron',sans-serif;font-size:0.65rem;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(255,0,100,0.4),inset 0 0 10px rgba(255,0,100,0.2);text-shadow:0 0 6px #ff0064;flex-direction:column;gap:2px}
#boostBtn .boost-icon{font-size:1.2rem}
#orientationHint{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:rgba(5,5,20,0.95);display:none;align-items:center;justify-content:center;flex-direction:column;color:#00ffff;font-family:'Noto Sans SC',sans-serif;text-align:center;padding:20px}
#orientationHint .rotate-icon{font-size:4rem;margin-bottom:20px;animation:rotateHint 2s ease-in-out infinite}
#orientationHint p{font-size:1.1rem;text-shadow:0 0 8px #00ffff}
@keyframes rotateHint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(90deg)}}
/* Mobile-specific styles */
@media(max-width:900px),(hover:none){
  .btn-start{padding:20px 56px;font-size:clamp(1rem,3vw,1.3rem);min-height:56px}
  .hud-tl div{font-size:0.85rem;padding:5px 14px}
  #leaderboard{width:140px;top:calc(50px + env(safe-area-inset-top));right:10px;opacity:0.7;padding:6px;max-height:120px}
  #leaderboard h4{font-size:0.5rem;margin-bottom:4px}
  .lb-item{font-size:0.5rem;padding:2px 0}
  .lb-rank{width:12px;font-size:0.45rem}
  .lb-len{font-size:0.45rem}
  #minimap{width:100px;height:100px;bottom:calc(10px + env(safe-area-inset-bottom));right:10px}
  .hud-bl{bottom:calc(20px + env(safe-area-inset-bottom));left:10px}
  .hint.mobile-hint{display:block}
  .hint.pc-hint{display:none}
  #startScreen .pc-controls-hint{display:none}
  #startScreen .mobile-controls-hint{display:block}
}
@media(min-width:901px){
  .hint.mobile-hint{display:none}
  .hint.pc-hint{display:block}
  #startScreen .pc-controls-hint{display:block}
  #startScreen .mobile-controls-hint{display:none}
}
/* PC端字体放大 */
@media (min-width:900px) and (hover:hover){
  .hud-tl div{font-size:1.1rem;padding:6px 14px}
  #leaderboard h4{font-size:0.8rem}
  .lb-item{font-size:0.8rem}
  .lb-rank{font-size:0.75rem;width:20px}
  .lb-len{font-size:0.75rem}
  #scoreDisplay{font-size:1.2rem!important}
  #startScreen h1{font-size:clamp(2.5rem,7vw,5rem)}
  .btn-start{font-size:clamp(1rem,2.2vw,1.4rem);padding:18px 56px}
  .hint{font-size:0.85rem}
  .pause-btn{font-size:1rem;padding:16px 28px}
  .pause-card h2{font-size:2.2rem}
  #startScreen h2{font-size:clamp(1rem,2.8vw,1.6rem)}
  .start-record{font-size:0.85rem}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-tl">
    <div id="scoreDisplay">分数: 0</div>
    <div id="rankDisplay">段位: 青铜</div>
    <div id="levelDisplay">Level 1</div>
  </div>
  <div class="hud-tr">
    <button class="hud-btn" id="pauseBtn" onclick="togglePause()">⏸</button>
  </div>
  <div class="hud-bl">
    <div id="lengthDisplay">长度: 10</div>
    <div class="boost-bar"><div class="boost-bar-inner" id="boostBar" style="width:100%"></div></div>
  </div>
  <div id="leaderboard"><h4>排行榜</h4><div id="lbList"></div></div>
</div>
<canvas id="minimap"></canvas>
<div id="startScreen" class="overlay active">
  <canvas class="beat-canvas" id="beatCanvas"></canvas>
  <h1 id="titleText">NEO SERPENT</h1>
  <h2>霓 虹 贪 吃 蛇</h2>
  <button class="btn-start" onclick="startGame()">开 始 游 戏</button>
  <div class="start-record" id="startRecord"></div>
  <p class="pc-controls-hint" style="color:rgba(200,220,255,0.4);font-size:0.65rem;margin-top:1.5em;font-family:'Noto Sans SC',sans-serif">鼠标控制方向 · 左键/空格加速 · ESC暂停</p>
  <p class="mobile-controls-hint" style="color:rgba(200,220,255,0.4);font-size:0.65rem;margin-top:1.5em;font-family:'Noto Sans SC',sans-serif;display:none">摇杆/滑动控制方向 | 按钮/双指加速 | 建议横屏游玩</p>
</div>
<div id="gameOver" class="overlay" style="display:none">
  <h2>游 戏 结 束</h2>
  <div class="stats" id="goStats"></div>
  <button class="btn-start" onclick="startGame()">再 来 一 局</button>
</div>
<div id="pauseMenu">
  <div class="pause-card">
    <h2>已 暂 停</h2>
    <button class="pause-btn primary" onclick="togglePause()">继续游戏</button>
    <button class="pause-btn secondary" onclick="restartFromPause()">重新开始</button>
    <button class="pause-btn secondary" onclick="exitToMenu()">退出到主页</button>
  </div>
</div>
<div id="killFeed"></div>
<div id="zoneWarning">⚠ 安全区域缩小</div>
<div id="rankUp"></div>
<div id="joystick"><div id="joystickKnob"></div></div>
<button id="boostBtn"><span class="boost-icon">⚡</span>加速</button>
<div class="hint pc-hint" id="hint">鼠标控制方向 | 左键/空格 加速 | ESC 暂停</div>
<div class="hint mobile-hint" id="hintMobile">摇杆控制 | 按钮加速 | 双指加速</div>
<div id="orientationHint"><div class="rotate-icon">📱</div><p>建议横屏游玩<br>获得最佳体验</p></div>
<script>
const CVS=document.getElementById('game'),ctx=CVS.getContext('2d');
const miniCvs=document.getElementById('minimap'),mCtx=miniCvs.getContext('2d');
const WORLD_INIT=4000,SEG_R=9,SEG_SPACING=13,BASE_SPEED=130,BOOST_SPEED=270;
const MAX_TURN=4.8,FOOD_COUNT=120,AI_COUNT_BASE=4;
const NEON_COLORS=['#00ffff','#ff00ff','#00ff88','#ffaa00','#ff0066','#8800ff','#00aaff'];
const FOOD_COLORS=['#00ffff','#ff00ff','#00ff88','#ffaa00','#ff0066','#88ff00','#ff8800','#aa00ff'];
const AI_NAMES=['幽灵蛇','暗影','闪电','猛毒','夜行者','冰霜','烈焰','风暴','深渊','天狼','黑曜','幻影','毒牙','雷鸣','星陨','魅影','噬魂','冥蛇','赤龙','极光'];
const RANKS=[{name:'青铜',color:'#888',min:0},{name:'白银',color:'#c0c0c0',min:500},{name:'黄金',color:'#ffd700',min:1500},{name:'铂金',color:'#00e5ff',min:3000},{name:'钻石',color:'#aa66ff',min:5000},{name:'传说',color:'rainbow',min:8000}];
let W,H,dpr,gameRunning=false,gamePaused=false,gameTime=0,score=0;
let camera={x:WORLD_INIT/2,y:WORLD_INIT/2,tx:WORLD_INIT/2,ty:WORLD_INIT/2};
let mouse={x:0,y:0,active:false},keys={},boosting=false;
let player=null,aiSnakes=[],foods=[],particles=[],bgParticles=[];
let lastTime=0,highScore=parseInt(localStorage.getItem('neoSerpentHigh'))||0;
let highRank=localStorage.getItem('neoSerpentRank')||'青铜';
let audioCtx=null,shakeTimer=0,flashTimer=0;
let level=1,worldSize=WORLD_INIT,zoneTimer=0,zoneShrinking=false;
let killCount=0,killCombo=0,comboTimer=0,currentRankIdx=0,maxLength=10,totalKills=0,maxLevel=1;
let aiTargetCount=AI_COUNT_BASE,aiRespawnQueue=[];
let mobile=false;
// Full-screen touch drag state
let dragActive=false,dragStartX=0,dragStartY=0;

function resize(){
  dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;
  CVS.width=W*dpr;CVS.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  let mmSize=mobile?100:140;
  miniCvs.width=mmSize*dpr;miniCvs.height=mmSize*dpr;
  mCtx.setTransform(dpr,0,0,dpr,0,0);
  miniCvs.style.width=mmSize+'px';miniCvs.style.height=mmSize+'px';
}
window.addEventListener('resize',resize);

function isMobile(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||('ontouchstart' in window&&window.innerWidth<900)}
mobile=isMobile();

// Orientation handling
function checkOrientation(){
  if(!mobile)return;
  let hint=document.getElementById('orientationHint');
  if(window.innerHeight>window.innerWidth){
    hint.style.display='flex';
  } else {
    hint.style.display='none';
  }
}
window.addEventListener('orientationchange',function(){
  setTimeout(function(){resize();checkOrientation();},300);
});
window.addEventListener('resize',checkOrientation);

resize();

// Prevent default touch behaviors on mobile
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('gesturestart',function(e){e.preventDefault()});

function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type='sine',vol=0.15){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}
function playEat(size){initAudio();if(size===0)playTone(880,0.1,'sine',0.12);else if(size===1){playTone(660,0.15,'sine',0.15);playTone(990,0.15,'sine',0.1)}else{playTone(440,0.2,'triangle',0.18);playTone(880,0.25,'sine',0.12)}}
function playDeath(){initAudio();playTone(150,0.4,'sawtooth',0.2);playTone(80,0.6,'square',0.15);setTimeout(()=>playTone(60,0.3,'sawtooth',0.1),200)}
function playBoost(){initAudio();playTone(100,0.08,'sine',0.06)}
function playKill(){initAudio();playTone(523,0.15,'sine',0.2);playTone(659,0.15,'sine',0.15);setTimeout(()=>playTone(784,0.2,'sine',0.18),100)}
function getRank(s){for(let i=RANKS.length-1;i>=0;i--)if(s>=RANKS[i].min)return i;return 0}
function getRankColor(idx){return RANKS[idx].color==='rainbow'?`hsl(${(performance.now()*0.1)%360},100%,60%)`:RANKS[idx].color}
function getAICount(){if(level<4)return AI_COUNT_BASE;if(level<7)return 6;if(level<10)return 8;return 9}
function getAISpeedMult(){if(level<4)return 1;if(level<7)return 1.1;if(level<10)return 1.2;return 1.3}
class Snake{
  constructor(x,y,color,isPlayer=false){
    this.segments=[{x,y}];this.angle=Math.random()*Math.PI*2;this.targetAngle=this.angle;
    this.color=color;this.isPlayer=isPlayer;this.speed=BASE_SPEED;this.boosting=false;
    this.alive=true;this.length=10;this.boostCooldown=0;
    this.name=isPlayer?'你':'';this.personality='normal';
    for(let i=1;i<this.length;i++){this.segments.push({x:x-Math.cos(this.angle)*SEG_SPACING*i,y:y-Math.sin(this.angle)*SEG_SPACING*i})}
  }
  grow(n){for(let i=0;i<n;i++){const last=this.segments[this.segments.length-1];this.segments.push({x:last.x,y:last.y});this.length++}}
  update(dt){
    if(!this.alive)return;
    let turnSpeed=MAX_TURN*dt;
    let angleDiff=this.targetAngle-this.angle;
    while(angleDiff>Math.PI)angleDiff-=Math.PI*2;
    while(angleDiff<-Math.PI)angleDiff+=Math.PI*2;
    if(Math.abs(angleDiff)<turnSpeed)this.angle=this.targetAngle;
    else this.angle+=Math.sign(angleDiff)*turnSpeed;
    let spd=this.boosting?BOOST_SPEED:this.speed;
    let head=this.segments[0];
    head.x+=Math.cos(this.angle)*spd*dt;
    head.y+=Math.sin(this.angle)*spd*dt;
    for(let i=1;i<this.segments.length;i++){
      let prev=this.segments[i-1],seg=this.segments[i];
      let dx=prev.x-seg.x,dy=prev.y-seg.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>SEG_SPACING){let ratio=SEG_SPACING/dist;seg.x=prev.x-dx*ratio;seg.y=prev.y-dy*ratio}
    }
    if(this.boosting&&this.length>5){
      this.boostCooldown-=dt;
      if(this.boostCooldown<=0){this.boostCooldown=0.3;
        if(this.segments.length>5){let tail=this.segments.pop();this.length--;foods.push(createFood(tail.x,tail.y,0));if(this.isPlayer)playBoost()}
      }
    }
  }
  getHead(){return this.segments[0]}
}
function createFood(x,y,size){
  if(x===undefined){let margin=(WORLD_INIT-worldSize)/2;x=Math.random()*(worldSize-200)+margin+100;y=Math.random()*(worldSize-200)+margin+100}
  if(size===undefined){let r=Math.random();size=r<0.7?0:r<0.92?1:2}
  let radius=size===0?5:size===1?8:12,value=size===0?1:size===1?3:5;
  return{x,y,size,radius,value,color:FOOD_COLORS[Math.floor(Math.random()*FOOD_COLORS.length)],pulse:Math.random()*Math.PI*2,rotAngle:Math.random()*Math.PI*2}
}
function spawnFoods(){while(foods.length<FOOD_COUNT)foods.push(createFood())}
function createAI(forcePersonality){
  let margin=(WORLD_INIT-worldSize)/2+100;
  let x=Math.random()*(worldSize-200)+margin,y=Math.random()*(worldSize-200)+margin;
  let personality=forcePersonality||(['aggressive','defensive','greedy','normal'])[Math.floor(Math.random()*4)];
  let colorMap={aggressive:['#ff0066','#ffaa00'][Math.floor(Math.random()*2)],defensive:'#00ff88',greedy:['#8800ff','#ffaa00'][Math.floor(Math.random()*2)],normal:NEON_COLORS[Math.floor(Math.random()*NEON_COLORS.length)],hunter:'#ff0000'};
  let color=colorMap[personality]||NEON_COLORS[Math.floor(Math.random()*NEON_COLORS.length)];
  let snake=new Snake(x,y,color,false);
  let extraLen=Math.floor(Math.random()*10)+5+level*2;
  snake.grow(Math.min(extraLen,40));
  snake.aiTimer=0;snake.aiTarget=null;snake.personality=personality;
  snake.name=AI_NAMES[Math.floor(Math.random()*AI_NAMES.length)];

}

function findNearestDanger(head,snake,range){
  let nearest=null,minD=range;
  for(let ai of aiSnakes){
    if(!ai.alive||ai===snake)continue;
    for(let i=0;i<ai.segments.length;i++){
      let s=ai.segments[i],d=Math.hypot(s.x-head.x,s.y-head.y);
      if(d<minD){minD=d;nearest={x:s.x,y:s.y,d}}
    }
  }
  if(player&&player.alive&&snake!==player){
    for(let i=1;i<player.segments.length;i++){
      let s=player.segments[i],d=Math.hypot(s.x-head.x,s.y-head.y);
      if(d<minD){minD=d;nearest={x:s.x,y:s.y,d}}
    }
  }
  return nearest;
}
function updateAI(snake,dt){
  if(!snake.alive)return;
  snake.aiTimer-=dt;
  let head=snake.getHead();
  let margin=(WORLD_INIT-worldSize)/2+100;
  let safeMin=margin,safeMax=WORLD_INIT-margin;
  let danger=findNearestDanger(head,snake,80);
  if(danger){
    let awayAngle=Math.atan2(head.y-danger.y,head.x-danger.x);
    snake.targetAngle=awayAngle;snake.aiTimer=0.3;
    snake.update(dt);return;
  }
  if(snake.personality==='aggressive'||snake.personality==='hunter'){
    if(player&&player.alive){
      let ph=player.getHead(),d=Math.hypot(ph.x-head.x,ph.y-head.y);
      if(d<(snake.personality==='hunter'?800:400)){
        let predictX=ph.x+Math.cos(player.angle)*d*0.3;
        let predictY=ph.y+Math.sin(player.angle)*d*0.3;
        snake.targetAngle=Math.atan2(predictY-head.y,predictX-head.x);
        snake.boosting=d<200&&snake.length>8;
        snake.update(dt);return;
      }
    }
  }
  if(snake.personality==='defensive'){
    snake.circleAngle+=dt*1.5;
    if(snake.length>25){
      let circX=head.x+Math.cos(snake.circleAngle)*60;
      let circY=head.y+Math.sin(snake.circleAngle)*60;
      snake.targetAngle=Math.atan2(circY-head.y,circX-head.x);
    }else{
      if(snake.aiTimer<=0){
        snake.aiTimer=1.5;
        let closest=null,closestDist=400;
        for(let f of foods){let d=Math.hypot(f.x-head.x,f.y-head.y);if(d<closestDist){closestDist=d;closest=f}}
        if(closest)snake.aiTarget={x:closest.x,y:closest.y};
        else{snake.circleAngle+=0.5;snake.aiTarget={x:head.x+Math.cos(snake.circleAngle)*150,y:head.y+Math.sin(snake.circleAngle)*150}}
      }
      if(snake.aiTarget)snake.targetAngle=Math.atan2(snake.aiTarget.y-head.y,snake.aiTarget.x-head.x);
    }
    for(let other of aiSnakes){
      if(other===snake||!other.alive)continue;
      let oh=other.getHead(),d=Math.hypot(oh.x-head.x,oh.y-head.y);
      if(d<200&&other.length>snake.length*1.3){
        snake.targetAngle=Math.atan2(head.y-oh.y,head.x-oh.x);break;
      }
    }
    snake.boosting=false;snake.update(dt);return;
  }
  if(snake.personality==='greedy'){
    if(snake.aiTimer<=0){
      snake.aiTimer=0.8;
      let bestFood=null,bestScore=-1;
      for(let f of foods){
        let d=Math.hypot(f.x-head.x,f.y-head.y);
        if(d>500)continue;
        let sc=f.value/(d+1)*100;
        if(sc>bestScore){bestScore=sc;bestFood=f}
      }
      if(bestFood)snake.aiTarget={x:bestFood.x,y:bestFood.y,big:bestFood.size>=2};
      else snake.aiTarget={x:head.x+(Math.random()-0.5)*300,y:head.y+(Math.random()-0.5)*300};
    }
    if(snake.aiTarget){
      snake.targetAngle=Math.atan2(snake.aiTarget.y-head.y,snake.aiTarget.x-head.x);
      snake.boosting=snake.aiTarget.big&&snake.length>8;
    }
    snake.update(dt);return;
  }
  if(snake.aiTimer<=0||!snake.aiTarget){
    snake.aiTimer=1+Math.random()*2;
    let closest=null,closestDist=600;
    for(let f of foods){let d=Math.hypot(f.x-head.x,f.y-head.y);if(d<closestDist){closestDist=d;closest=f}}
    if(closest)snake.aiTarget={x:closest.x,y:closest.y};
    else snake.aiTarget={x:head.x+Math.cos(snake.angle)*200,y:head.y+Math.sin(snake.angle)*200};
    if(Math.random()<0.15)snake.aiTarget={x:head.x+(Math.random()-0.5)*400,y:head.y+(Math.random()-0.5)*400};
  }
  if(head.x<safeMin+50)snake.aiTarget={x:head.x+300,y:head.y};
  else if(head.x>safeMax-50)snake.aiTarget={x:head.x-300,y:head.y};
  if(head.y<safeMin+50)snake.aiTarget={x:head.x,y:head.y+300};
  else if(head.y>safeMax-50)snake.aiTarget={x:head.x,y:head.y-300};
  snake.targetAngle=Math.atan2(snake.aiTarget.y-head.y,snake.aiTarget.x-head.x);
  snake.boosting=false;
  snake.update(dt);
}
function updateDifficulty(dt){
  let newLevel=Math.floor(gameTime/30)+1;
  if(newLevel>level){level=newLevel;if(level>maxLevel)maxLevel=level}
  aiTargetCount=getAICount();
  if(level>=5){
    zoneTimer+=dt;
    if(zoneTimer>=30){
      zoneTimer=0;
      let newSize=worldSize-100;
      if(newSize>=1500){worldSize=newSize;showZoneWarning();zoneShrinking=true;setTimeout(()=>zoneShrinking=false,2000)}
    }
  }
  if(level>=10){
    let hunters=aiSnakes.filter(a=>a.personality==='hunter');
    if(hunters.length<2&&aiSnakes.length<aiTargetCount){
      aiSnakes.push(createAI('hunter'));
    }
  }
}
function checkZoneDamage(dt){
  if(!player||!player.alive)return;
  let head=player.getHead();
  let margin=(WORLD_INIT-worldSize)/2;
  if(head.x<margin||head.x>WORLD_INIT-margin||head.y<margin||head.y>WORLD_INIT-margin){
    player.boostCooldown-=dt;
    if(player.boostCooldown<=0){
      player.boostCooldown=0.5;
      if(player.segments.length>3){player.segments.pop();player.length--;score=Math.max(0,score-5)}
      else{gameOver();return}
    }
  }
}
function checkCollisions(){
  if(!player||!player.alive)return;
  let head=player.getHead();
  if(head.x<5||head.x>WORLD_INIT-5||head.y<5||head.y>WORLD_INIT-5){gameOver();return}
  for(let i=foods.length-1;i>=0;i--){
    let f=foods[i],d=Math.hypot(f.x-head.x,f.y-head.y);
    if(d<f.radius+SEG_R){player.grow(f.value);score+=f.value*10;if(player.length>maxLength)maxLength=player.length;addParticle(f.x,f.y,f.color,6);playEat(f.size);foods.splice(i,1)}
  }
  for(let i=10;i<player.segments.length;i++){
    let seg=player.segments[i],d=Math.hypot(seg.x-head.x,seg.y-head.y);
    if(d<SEG_R*1.5){gameOver();return}
  }
  for(let ai of aiSnakes){
    if(!ai.alive)continue;
    for(let i=0;i<ai.segments.length;i++){
      let seg=ai.segments[i],d=Math.hypot(seg.x-head.x,seg.y-head.y);
      if(d<SEG_R*2){gameOver();return}
    }
    let aiHead=ai.getHead();
    for(let i=1;i<player.segments.length;i++){
      let seg=player.segments[i],d=Math.hypot(seg.x-aiHead.x,seg.y-aiHead.y);
      if(d<SEG_R*2){
        ai.alive=false;
        for(let s of ai.segments){foods.push(createFood(s.x+(Math.random()-0.5)*15,s.y+(Math.random()-0.5)*15,Math.random()<0.3?1:0));addParticle(s.x,s.y,ai.color,2)}
        score+=50;showKillFeed(ai.name);break;
      }
    }
  }
  for(let i=0;i<aiSnakes.length;i++){
    let ai=aiSnakes[i];if(!ai.alive)continue;
    let aiHead=ai.getHead();
    for(let j=0;j<aiSnakes.length;j++){
      if(i===j||!aiSnakes[j].alive)continue;
      for(let k=1;k<aiSnakes[j].segments.length;k++){
        let seg=aiSnakes[j].segments[k],d=Math.hypot(seg.x-aiHead.x,seg.y-aiHead.y);
        if(d<SEG_R*2){ai.alive=false;for(let s of ai.segments){foods.push(createFood(s.x+(Math.random()-0.5)*10,s.y+(Math.random()-0.5)*10,0))}break}
      }
      if(!ai.alive)break;
    }
  }
  for(let ai of aiSnakes){
    if(!ai.alive)continue;
    let aiHead=ai.getHead();
    for(let i=foods.length-1;i>=0;i--){
      let f=foods[i],d=Math.hypot(f.x-aiHead.x,f.y-aiHead.y);
      if(d<f.radius+SEG_R){ai.grow(f.value+2);foods.splice(i,1);break}
    }
  }
  spawnFoods();
  aiSnakes=aiSnakes.filter(a=>{if(!a.alive){aiRespawnQueue.push(3);return false}return true});
  while(aiSnakes.length<aiTargetCount&&aiRespawnQueue.length===0)aiRespawnQueue.push(0.5);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=0.95;p.vy*=0.95;if(p.life<=0)particles.splice(i,1)}
  for(let p of bgParticles){p.x+=Math.cos(p.angle)*p.speed*dt;p.y+=Math.sin(p.angle)*p.speed*dt;if(p.x<0)p.x=WORLD_INIT;if(p.x>WORLD_INIT)p.x=0;if(p.y<0)p.y=WORLD_INIT;if(p.y>WORLD_INIT)p.y=0}
}
function updateCamera(dt){if(!player)return;let head=player.getHead();camera.tx=head.x;camera.ty=head.y;camera.x+=(camera.tx-camera.x)*4*dt;camera.y+=(camera.ty-camera.y)*4*dt}
function worldToScreen(wx,wy){return{x:wx-camera.x+W/2,y:wy-camera.y+H/2}}
function isInView(wx,wy,margin=100){let s=worldToScreen(wx,wy);return s.x>-margin&&s.x<W+margin&&s.y>-margin&&s.y<H+margin}
function drawBackground(){
  ctx.fillStyle='#0a0a2e';ctx.fillRect(0,0,W,H);
  let gridSize=60,offsetX=(-camera.x%gridSize+gridSize)%gridSize,offsetY=(-camera.y%gridSize+gridSize)%gridSize;
  let gridBeat=getBeat();
  let gridAlpha=0.08+0.08*Math.sin(gridBeat.t*0.0005*Math.PI*2);
  ctx.strokeStyle=`rgba(0,100,180,${gridAlpha.toFixed(3)})`;ctx.lineWidth=0.5;ctx.beginPath();
  for(let x=offsetX;x<W;x+=gridSize){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=offsetY;y<H;y+=gridSize){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
  for(let p of bgParticles){if(!isInView(p.x,p.y,50))continue;let s=worldToScreen(p.x,p.y);ctx.globalAlpha=p.alpha*(0.5+0.5*Math.sin(performance.now()*0.002+p.angle));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(s.x,s.y,p.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
}
function drawBoundary(){
  let margin=(WORLD_INIT-worldSize)/2;
  let corners=[[margin,margin],[WORLD_INIT-margin,margin],[WORLD_INIT-margin,WORLD_INIT-margin],[margin,WORLD_INIT-margin]];
  ctx.strokeStyle='#ff0055';ctx.lineWidth=3;
  if(!mobile){ctx.shadowColor='#ff0055';ctx.shadowBlur=20;}
  ctx.beginPath();
  for(let i=0;i<4;i++){let[x1,y1]=corners[i],s=worldToScreen(x1,y1);if(i===0)ctx.moveTo(s.x,s.y);else ctx.lineTo(s.x,s.y)}
  ctx.closePath();ctx.stroke();ctx.shadowBlur=0;
  if(worldSize<WORLD_INIT){
    ctx.fillStyle='rgba(255,0,0,0.06)';
    let tl=worldToScreen(0,0),br=worldToScreen(WORLD_INIT,margin);
    ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
    tl=worldToScreen(0,WORLD_INIT-margin);br=worldToScreen(WORLD_INIT,WORLD_INIT);
    ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
    tl=worldToScreen(0,margin);br=worldToScreen(margin,WORLD_INIT-margin);
    ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
    tl=worldToScreen(WORLD_INIT-margin,margin);br=worldToScreen(WORLD_INIT,WORLD_INIT-margin);
    ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
  }
}
function drawFood(){
  let t=performance.now()*0.003;
  for(let f of foods){
    if(!isInView(f.x,f.y,20))continue;
    let s=worldToScreen(f.x,f.y),pulse=1+0.25*Math.sin(t+f.pulse),r=f.radius*pulse;
    if(mobile){
      // Mobile: only shadow for large food
      if(f.size>=2){ctx.shadowColor=f.color;ctx.shadowBlur=10;}
      else{ctx.shadowBlur=0;}
    } else {
      ctx.shadowColor=f.color;ctx.shadowBlur=f.size===0?8:f.size===1?14:20;
    }
    ctx.fillStyle=f.color;ctx.globalAlpha=0.9;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
    // Mobile: simulate glow with transparent circle for small food
    if(mobile&&f.size<2){
      ctx.globalAlpha=0.2;ctx.beginPath();ctx.arc(s.x,s.y,r+3,0,Math.PI*2);ctx.fill();
    }
    if(f.size>=2){ctx.strokeStyle=f.color;ctx.lineWidth=1.5;ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(s.x,s.y,r+4,f.rotAngle+t*0.5,f.rotAngle+t*0.5+Math.PI*1.2);ctx.stroke()}
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
}
function drawSnake(snake){
  if(!snake.alive)return;
  let segs=snake.segments,len=segs.length;
  for(let i=len-1;i>=0;i--){
    let seg=segs[i];if(!isInView(seg.x,seg.y,30))continue;
    let s=worldToScreen(seg.x,seg.y),ratio=1-i/len,r=SEG_R*(0.7+0.3*ratio);
    if(i===0)r=SEG_R*1.3;
    let alpha=0.6+0.4*ratio,color=snake.color;
    if(snake.isPlayer){let hue=180+i*2;color=`hsl(${hue%360},100%,60%)`}
    if(mobile){
      // Mobile: reduce shadow significantly
      if(snake.isPlayer){ctx.shadowColor=color;ctx.shadowBlur=6;}
      else{ctx.shadowBlur=0;}
    } else {
      let snkBeat=getBeat();
      let baseShadow=snake.isPlayer?12:8;
      let beatShadow=snake.isPlayer?baseShadow+snkBeat.intensity*6:baseShadow+snkBeat.intensity*3;
      ctx.shadowColor=color;ctx.shadowBlur=beatShadow;
    }
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
    // Mobile: simulate glow for AI with transparent ring instead of shadow
    if(mobile&&!snake.isPlayer){
      ctx.globalAlpha=alpha*0.2;ctx.beginPath();ctx.arc(s.x,s.y,r+2,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=0.3;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x-r*0.25,s.y-r*0.25,r*0.3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    if(i===0){
      ctx.shadowBlur=0;let eyeOff=r*0.4,eyeR=r*0.25;
      let ex1=s.x+Math.cos(snake.angle-0.4)*eyeOff,ey1=s.y+Math.sin(snake.angle-0.4)*eyeOff;
      let ex2=s.x+Math.cos(snake.angle+0.4)*eyeOff,ey2=s.y+Math.sin(snake.angle+0.4)*eyeOff;
      ctx.fillStyle='#fff';
      if(!mobile){ctx.shadowColor='#fff';ctx.shadowBlur=6;}
      ctx.beginPath();ctx.arc(ex1,ey1,eyeR,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2,ey2,eyeR,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(ex1+Math.cos(snake.angle)*eyeR*0.3,ey1+Math.sin(snake.angle)*eyeR*0.3,eyeR*0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(ex2+Math.cos(snake.angle)*eyeR*0.3,ey2+Math.sin(snake.angle)*eyeR*0.3,eyeR*0.5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.shadowBlur=0;
  if(snake.boosting&&snake.isPlayer){
    let tail=segs[segs.length-1];if(isInView(tail.x,tail.y)){
      let s=worldToScreen(tail.x,tail.y);ctx.globalAlpha=0.4;ctx.fillStyle=snake.color;
      for(let i=0;i<3;i++){let ox=(Math.random()-0.5)*10,oy=(Math.random()-0.5)*10;ctx.beginPath();ctx.arc(s.x+ox,s.y+oy,2+Math.random()*2,0,Math.PI*2);ctx.fill()}
      ctx.globalAlpha=1;
    }
  }
}
function drawParticles(){
  for(let p of particles){if(!isInView(p.x,p.y,10))continue;let s=worldToScreen(p.x,p.y);
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    if(!mobile){ctx.shadowColor=p.color;ctx.shadowBlur=5;}
    ctx.beginPath();ctx.arc(s.x,s.y,p.r*(p.life/p.maxLife),0,Math.PI*2);ctx.fill()}
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}
function drawMinimap(){
  let mmSize=mobile?100:140;
  mCtx.clearRect(0,0,mmSize,mmSize);mCtx.fillStyle='rgba(10,10,46,0.8)';mCtx.fillRect(0,0,mmSize,mmSize);
  let scale=mmSize/WORLD_INIT;
  let margin=(WORLD_INIT-worldSize)/2;
  if(margin>0){
    mCtx.fillStyle='rgba(255,0,0,0.15)';mCtx.fillRect(0,0,mmSize,mmSize);
    mCtx.clearRect(margin*scale,margin*scale,worldSize*scale,worldSize*scale);
    mCtx.fillStyle='rgba(10,10,46,0.8)';mCtx.fillRect(margin*scale,margin*scale,worldSize*scale,worldSize*scale);
  }
  mCtx.strokeStyle='rgba(255,0,85,0.5)';mCtx.lineWidth=1;mCtx.strokeRect(margin*scale,margin*scale,worldSize*scale,worldSize*scale);
  for(let f of foods){mCtx.fillStyle='rgba(0,255,200,0.3)';mCtx.fillRect(f.x*scale,f.y*scale,1,1)}
  for(let ai of aiSnakes){if(!ai.alive)continue;let h=ai.getHead();mCtx.fillStyle=ai.color;mCtx.globalAlpha=0.7;mCtx.beginPath();mCtx.arc(h.x*scale,h.y*scale,2.5,0,Math.PI*2);mCtx.fill()}
  if(player&&player.alive){let h=player.getHead();mCtx.fillStyle='#00ffff';mCtx.globalAlpha=1;
    if(!mobile){mCtx.shadowColor='#00ffff';mCtx.shadowBlur=4;}
    mCtx.beginPath();mCtx.arc(h.x*scale,h.y*scale,3,0,Math.PI*2);mCtx.fill();
    let vw=W*scale,vh=H*scale;mCtx.shadowBlur=0;mCtx.strokeStyle='rgba(0,255,255,0.4)';mCtx.lineWidth=0.8;mCtx.strokeRect(h.x*scale-vw/2,h.y*scale-vh/2,vw,vh)}
  mCtx.globalAlpha=1;mCtx.shadowBlur=0;
}
function drawHUD(){
  if(!player)return;
  let rankIdx=getRank(score);
  if(rankIdx>currentRankIdx){currentRankIdx=rankIdx;showRankUp(rankIdx)}
  document.getElementById('scoreDisplay').innerHTML='分数: '+score+' <span style="color:'+getRankColor(rankIdx)+';font-size:0.7rem">'+RANKS[rankIdx].name+'</span>';
  document.getElementById('rankDisplay').innerHTML='<span style="color:'+getRankColor(rankIdx)+'">▣</span> '+RANKS[rankIdx].name;
  document.getElementById('levelDisplay').textContent='Level '+level;
  document.getElementById('lengthDisplay').textContent='长度: '+player.length;
  let boostPercent=Math.max(0,Math.min(100,(player.length-5)/(maxLength||50)*100));
  document.getElementById('boostBar').style.width=boostPercent+'%';
  updateLeaderboard();
}
function updateLeaderboard(){
  let allSnakes=[{name:'你',length:player?player.length:0,isPlayer:true,color:'#00ffff'}];
  for(let ai of aiSnakes){if(ai.alive)allSnakes.push({name:ai.name,length:ai.length,isPlayer:false,color:ai.color})}
  allSnakes.sort((a,b)=>b.length-a.length);
  let maxShow=mobile?3:8;
  let html='';
  for(let i=0;i<Math.min(maxShow,allSnakes.length);i++){
    let s=allSnakes[i];
    html+='<div class="lb-item'+(s.isPlayer?' player':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name" style="color:'+s.color+'">'+s.name+'</span><span class="lb-len">'+s.length+'</span></div>';
  }
  document.getElementById('lbList').innerHTML=html;
}
function handleInput(){
  if(!player||!player.alive)return;
  if(mouse.active){let head=player.getHead(),s=worldToScreen(head.x,head.y);player.targetAngle=Math.atan2(mouse.y-s.y,mouse.x-s.x)}
  if(keys['ArrowLeft']||keys['KeyA'])player.targetAngle-=0.08;
  if(keys['ArrowRight']||keys['KeyD'])player.targetAngle+=0.08;
  player.boosting=boosting&&player.length>5;
}
function loop(ts){
  if(!gameRunning){requestAnimationFrame(loop);return}
  if(gamePaused){lastTime=ts;requestAnimationFrame(loop);return}
  let dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;gameTime+=dt;
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)killCombo=0}
  for(let i=aiRespawnQueue.length-1;i>=0;i--){
    aiRespawnQueue[i]-=dt;
    if(aiRespawnQueue[i]<=0){
      aiRespawnQueue.splice(i,1);
      if(aiSnakes.length<aiTargetCount){
        let personality=level>=7&&Math.random()<0.3?'aggressive':'normal';
        if(level>=10&&Math.random()<0.2)personality='hunter';
        aiSnakes.push(createAI(personality));
      }
    }
  }
  handleInput();updateDifficulty(dt);
  player.update(dt);
  for(let ai of aiSnakes)updateAI(ai,dt);
  checkCollisions();checkZoneDamage(dt);updateParticles(dt);updateCamera(dt);
  if(shakeTimer>0){shakeTimer-=dt;let s=shakeTimer*30;ctx.setTransform(dpr,0,0,dpr,Math.random()*s-s/2,Math.random()*s-s/2)}else{ctx.setTransform(dpr,0,0,dpr,0,0)}
  drawBackground();drawBoundary();drawFood();
  for(let ai of aiSnakes)drawSnake(ai);
  drawSnake(player);drawParticles();
  if(flashTimer>0){flashTimer-=dt;ctx.globalAlpha=flashTimer*3;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  drawMinimap();drawHUD();
  requestAnimationFrame(loop);
}
// Input handlers - PC
CVS.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true});
CVS.addEventListener('mousedown',e=>{if(e.button===0){boosting=true;initAudio()}});
CVS.addEventListener('mouseup',e=>{if(e.button===0)boosting=false});
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){boosting=true;e.preventDefault();initAudio()}
  if(e.code==='Escape'&&gameRunning)togglePause();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')boosting=false});

// Mobile controls
let joystickEl=document.getElementById('joystick'),knobEl=document.getElementById('joystickKnob');
let joyCenter={x:0,y:0},joyActive=false;
joystickEl.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;let r=joystickEl.getBoundingClientRect();joyCenter={x:r.left+r.width/2,y:r.top+r.height/2};handleJoy(e.touches[0])},{passive:false});
joystickEl.addEventListener('touchmove',e=>{e.preventDefault();if(joyActive)handleJoy(e.touches[0])},{passive:false});
joystickEl.addEventListener('touchend',e=>{joyActive=false;knobEl.style.transform='translate(-50%,-50%)';mouse.active=false});
function handleJoy(touch){
  let dx=touch.clientX-joyCenter.x,dy=touch.clientY-joyCenter.y,dist=Math.hypot(dx,dy),maxD=65;
  if(dist>maxD){dx=dx/dist*maxD;dy=dy/dist*maxD}
  knobEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  if(dist>10){let head=player.getHead(),s=worldToScreen(head.x,head.y);mouse.x=s.x+dx*5;mouse.y=s.y+dy*5;mouse.active=true}
}
let boostBtnEl=document.getElementById('boostBtn');
boostBtnEl.addEventListener('touchstart',e=>{e.preventDefault();boosting=true;initAudio()},{passive:false});
boostBtnEl.addEventListener('touchend',e=>{boosting=false});

// Full-screen drag control (touch anywhere on canvas to control direction)
CVS.addEventListener('touchstart',function(e){
  if(!gameRunning||gamePaused)return;
  initAudio();
  // Double finger = boost
  if(e.touches.length>=2){
    boosting=true;
    return;
  }
  // Check if touch is NOT on joystick or boost button area
  let touch=e.touches[0];
  let jRect=joystickEl.getBoundingClientRect();
  let bRect=boostBtnEl.getBoundingClientRect();
  let inJoy=touch.clientX>=jRect.left-20&&touch.clientX<=jRect.right+20&&touch.clientY>=jRect.top-20&&touch.clientY<=jRect.bottom+20;
  let inBoost=touch.clientX>=bRect.left-20&&touch.clientX<=bRect.right+20&&touch.clientY>=bRect.top-20&&touch.clientY<=bRect.bottom+20;
  if(inJoy||inBoost)return;
  dragActive=true;
  dragStartX=touch.clientX;
  dragStartY=touch.clientY;
},{passive:true});

CVS.addEventListener('touchmove',function(e){
  if(!gameRunning||gamePaused)return;
  // Double finger = boost
  if(e.touches.length>=2){
    boosting=true;
    return;
  }
  if(!dragActive)return;
  let touch=e.touches[0];
  let dx=touch.clientX-dragStartX;
  let dy=touch.clientY-dragStartY;
  let dist=Math.hypot(dx,dy);
  if(dist>10&&player&&player.alive){
    let head=player.getHead(),s=worldToScreen(head.x,head.y);
    mouse.x=s.x+dx*3;
    mouse.y=s.y+dy*3;
    mouse.active=true;
  }
},{passive:true});

CVS.addEventListener('touchend',function(e){
  if(e.touches.length<2){boosting=false}
  if(e.touches.length===0){
    dragActive=false;
    // Only reset mouse.active if joystick is also not active
    if(!joyActive)mouse.active=false;
  }
},{passive:true});

requestAnimationFrame(loop);

// === BPM Beat System ===
const BPM=120;
const BEAT_MS=60000/BPM;
function getBeat(){
  let t=performance.now();
  let beatProgress=(t%BEAT_MS)/BEAT_MS;
  let beat4=(t%(BEAT_MS*4))/(BEAT_MS*4);
  let intensity=Math.pow(1-beatProgress,3);
  let beat2=(t%(BEAT_MS*2))/(BEAT_MS*2);
  return{progress:beatProgress,bar:beat4,intensity,beat2,t};
}

// === Start Screen Neon Disco ===
let startScreenAnimId=null;
let beatDots=[];
const BEAT_DOT_COUNT=mobile?6:12;
const DOT_COLORS=['#00ffff','#ff00ff','#ffaa00','#00ff88','#ff0066','#8800ff'];

function initBeatDots(){
  beatDots=[];
  for(let i=0;i<BEAT_DOT_COUNT;i++){
    beatDots.push({
      x:Math.random(),y:Math.random(),
      color:DOT_COLORS[Math.floor(Math.random()*DOT_COLORS.length)],
      phase:i/BEAT_DOT_COUNT,
      size:Math.random()*3+2,
      drift:Math.random()*0.0003+0.0001,
      driftAngle:Math.random()*Math.PI*2
    });
  }
}
initBeatDots();

function startScreenLoop(){
  if(gameRunning){startScreenAnimId=null;return;}
  let beat=getBeat();
  let startEl=document.getElementById('startScreen');
  if(!startEl||startEl.style.display==='none'){startScreenAnimId=requestAnimationFrame(startScreenLoop);return;}

  // a) Title neon pulse
  let titleEl=document.getElementById('titleText');
  if(titleEl){
    let glowIntensity=10+beat.intensity*40;
    let glowIntensity2=30+beat.intensity*60;
    let hueShift=beat.beat2<0.5?0:20;
    let cyan=`hsl(${180+hueShift},100%,50%)`;
    titleEl.style.textShadow=`0 0 ${glowIntensity}px ${cyan},0 0 ${glowIntensity2}px ${cyan},0 0 ${glowIntensity2*1.5}px #0088ff,0 0 ${glowIntensity2*2}px #0044ff`;
    titleEl.style.color=cyan;
  }

  // b) Background hue cycle + beat brightness
  let bgHue=220+(beat.t*0.012%360)*0.125;
  let bgLight=8+beat.intensity*3;
  startEl.style.background=`radial-gradient(ellipse at center,hsl(${bgHue},70%,${bgLight}%) 0%,hsl(${bgHue+20},80%,${bgLight-4}%) 100%)`;

  // c) Button neon pulse
  let btnEl=startEl.querySelector('.btn-start');
  if(btnEl){
    let btnGlow=15+beat.intensity*25;
    let btnInner=15+beat.intensity*15;
    let borderFlash=beat.bar<0.05?'#ff00ff':'#00ffff';
    btnEl.style.boxShadow=`0 0 ${btnGlow}px rgba(0,255,255,${0.3+beat.intensity*0.4}),inset 0 0 ${btnInner}px rgba(0,255,255,${0.1+beat.intensity*0.2})`;
    btnEl.style.borderColor=borderFlash;
    btnEl.style.color=borderFlash;
    btnEl.style.textShadow=`0 0 8px ${borderFlash}`;
  }

  // d) Beat dots on canvas
  let bcvs=document.getElementById('beatCanvas');
  if(bcvs){
    let bw=bcvs.parentElement.offsetWidth;
    let bh=bcvs.parentElement.offsetHeight;
    if(bcvs.width!==bw*dpr||bcvs.height!==bh*dpr){bcvs.width=bw*dpr;bcvs.height=bh*dpr;bcvs.style.width=bw+'px';bcvs.style.height=bh+'px';}
    let bctx=bcvs.getContext('2d');
    bctx.setTransform(dpr,0,0,dpr,0,0);
    bctx.clearRect(0,0,bw,bh);
    for(let dot of beatDots){
      dot.driftAngle+=dot.drift*16;
      dot.x+=Math.cos(dot.driftAngle)*0.001;
      dot.y+=Math.sin(dot.driftAngle)*0.0008;
      if(dot.x<0)dot.x=1;if(dot.x>1)dot.x=0;
      if(dot.y<0)dot.y=1;if(dot.y>1)dot.y=0;
      let dotBeatPhase=((beat.progress+dot.phase)%1);
      let dotIntensity=Math.pow(1-dotBeatPhase,4);
      let dx=dot.x*bw,dy=dot.y*bh;
      let r=dot.size*(1+dotIntensity*2);
      bctx.globalAlpha=0.15+dotIntensity*0.7;
      bctx.fillStyle=dot.color;
      bctx.shadowColor=dot.color;
      bctx.shadowBlur=r*4;
      bctx.beginPath();bctx.arc(dx,dy,r,0,Math.PI*2);bctx.fill();
      bctx.shadowBlur=0;
    }
    bctx.globalAlpha=1;
  }

  // e) Subtitle neon color shift + letter-spacing
  let h2El=startEl.querySelector('h2');
  if(h2El){
    let subHue=beat.beat2<0.5?300:180;
    let subColor=`hsl(${subHue},100%,60%)`;
    h2El.style.color=subColor;
    h2El.style.textShadow=`0 0 ${8+beat.intensity*12}px ${subColor},0 0 ${20+beat.intensity*20}px ${subColor}`;
    let spacing=0.15+beat.bar*0.1;
    h2El.style.letterSpacing=spacing.toFixed(3)+'em';
  }

  startScreenAnimId=requestAnimationFrame(startScreenLoop);
}

// Start the disco loop when on start screen
startScreenLoop();

// Restart disco when returning to menu
let origExitToMenu=exitToMenu;
exitToMenu=function(){
  origExitToMenu();
  if(!startScreenAnimId)startScreenLoop();
};

</script>
